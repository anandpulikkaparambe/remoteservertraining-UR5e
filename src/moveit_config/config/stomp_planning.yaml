planning_plugins:
  - stomp_moveit/StompPlanner
# The order of the elements in the adapter corresponds to the order they are processed by
# the motion planning pipeline. AddTimeOptimalParameterization folded in here (not a
# separate response_adapters key) -- see ompl_planning.yaml's comment for why (this
# build's move_group binary silently ignores response_adapters).
request_adapters: default_planner_request_adapters/ResolveConstraintFrames default_planner_request_adapters/FixWorkspaceBounds default_planner_request_adapters/FixStartStateBounds default_planner_request_adapters/FixStartStateCollision default_planner_request_adapters/AddTimeOptimalParameterization

stomp_moveit:
  num_timesteps: 60
  num_iterations: 40
  num_iterations_after_valid: 0
  num_rollouts: 30
  max_rollouts: 30
  exponentiated_cost_sensitivity: 0.5
  control_cost_weight: 0.1
  delta_t: 0.1