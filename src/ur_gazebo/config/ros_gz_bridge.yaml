# # ✅ Correct clock bridging
# relative (not "/clock") so a namespaced parameter_bridge instance publishes its own
# instance's sim clock under its own namespace instead of colliding with another
# concurrently-running instance's /clock.
- topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Ground Truth Poses (Gazebo -> ROS TF)
- ros_topic_name: "/gz_poses_static"
  gz_topic_name: "/world/lego_sorting/pose/info"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
  qos:
    reliability: "best_effort"
    durability: "volatile"

