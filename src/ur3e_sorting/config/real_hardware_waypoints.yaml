# real_look_position (2026-09-01): a distinct pose for the wrist camera to see the cube,
# separate from real_pick_position -- at the pick pose the camera (mounted just behind the
# gripper) is too close to the table/rail to have any usable field of view at all (confirmed
# live: a snapshot from real_pick_position showed an extreme close-up of a rail, no cube
# visible). Freedrive-taught by directly aiming the camera until the cube was in frame.
# Confirmed working: sim-trained YOLO model (YoloV8_v2/runs/lego_color_20ep/weights/best.pt)
# detects the real cube from this pose at ~80-89% confidence, tight bounding box, despite the
# frame being somewhat out of focus (autofocus was off during this test).
